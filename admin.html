<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin | PRIME LEADER Official</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(230,0,0,.18),
            transparent 35%
        ),
        #050505;
    color:#fff;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        rgba(255,255,255,.015) 1px,
        transparent 1px
    );
    background-size:100% 4px;
    opacity:.25;
}

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
    padding:45px 0 70px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:30px;
}

.brand{
    color:#ff2020;
    font-size:12px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:12px;
}

.header h1{
    font-size:40px;
    letter-spacing:1px;
}

.header h1 span{
    color:#ff2020;
}

.header p{
    color:#777;
    margin-top:10px;
    font-size:13px;
}

/* LOGOUT */

.logout-btn{
    margin-top:16px;
    padding:10px 18px;
    border:1px solid #451616;
    border-radius:7px;
    background:#180909;
    color:#ff4444;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.logout-btn:hover{
    background:#e60000;
    color:#fff;
    border-color:#e60000;
}

/* PANEL */

.panel{
    background:linear-gradient(
        145deg,
        #0e0e0e,
        #090909
    );

    border:1px solid #292929;

    border-radius:14px;

    padding:28px;

    margin-bottom:25px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.panel-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:22px;
}

.panel-title span{
    color:#ff2020;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    padding:13px 14px;

    background:#151515;

    border:1px solid #303030;

    border-radius:7px;

    color:#fff;

    outline:none;

    font-size:13px;

    transition:.2s;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:#e60000;

    box-shadow:
        0 0 0 2px rgba(230,0,0,.08);
}

.form-group select option{
    background:#111;
}

/* BUTTON ROW */

.button-row{
    display:flex;
    gap:10px;
}

.add-btn,
.cancel-btn,
.refresh-btn{

    padding:13px 18px;

    border-radius:7px;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.add-btn{

    flex:1;

    border:0;

    background:#e60000;

    color:#fff;
}

.add-btn:hover{
    background:#ff2929;
    transform:translateY(-1px);
}

.add-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.cancel-btn{

    display:none;

    border:1px solid #444;

    background:#151515;

    color:#aaa;
}

.cancel-btn:hover{

    border-color:#e60000;

    color:#fff;
}

.refresh-btn{

    border:1px solid #333;

    background:#151515;

    color:#aaa;
}

.refresh-btn:hover{

    color:#fff;

    border-color:#e60000;
}

/* STATUS */

.status{

    margin-top:15px;

    padding:12px;

    border-radius:7px;

    display:none;

    font-size:12px;
}

.status.success{

    display:block;

    background:#09200f;

    border:1px solid #145c2c;

    color:#55e77b;
}

.status.error{

    display:block;

    background:#210909;

    border:1px solid #641717;

    color:#ff6666;
}

/* LIST HEADER */

.list-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.list-header .panel-title{
    margin-bottom:0;
}

/* DOWNLOAD LIST */

.download-list{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.download-item{

    display:flex;

    align-items:center;

    gap:15px;

    padding:17px;

    background:#121212;

    border:1px solid #292929;

    border-radius:10px;

    transition:.2s;
}

.download-item:hover{

    border-color:#4a1717;

    transform:translateY(-1px);
}

.download-icon{

    width:48px;

    height:48px;

    min-width:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#181818;

    border:1px solid #333;

    border-radius:9px;

    color:#ff2020;

    font-weight:900;

    font-size:18px;
}

.download-info{

    flex:1;

    min-width:0;
}

.download-info h3{

    font-size:15px;

    margin-bottom:5px;

    word-break:break-word;
}

.download-info small{

    display:block;

    color:#666;

    font-size:10px;

    line-height:1.5;

    word-break:break-word;
}

.category{

    display:inline-block;

    color:#ff2929;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:5px;
}

/* ACTIONS */

.actions{

    display:flex;

    gap:7px;
}

.edit-btn,
.delete-btn{

    padding:9px 12px;

    border-radius:6px;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.edit-btn{

    border:1px solid #303030;

    background:#181818;

    color:#aaa;
}

.edit-btn:hover{

    color:#fff;

    border-color:#e60000;
}

.delete-btn{

    border:1px solid #451616;

    background:#180909;

    color:#ff4444;
}

.delete-btn:hover{

    background:#e60000;

    color:#fff;

    border-color:#e60000;
}

/* EMPTY */

.empty{

    text-align:center;

    padding:35px 20px;

    border:1px dashed #292929;

    border-radius:10px;

    color:#666;

    font-size:12px;
}

/* BACK */

.back-btn{

    display:block;

    width:max-content;

    margin:25px auto 0;

    padding:10px 20px;

    border:1px solid #303030;

    border-radius:7px;

    color:#888;

    text-decoration:none;

    font-size:11px;

    font-weight:bold;

    transition:.2s;
}

.back-btn:hover{

    color:#fff;

    border-color:#e60000;
}

/* MOBILE */

@media(max-width:650px){

    .container{

        width:94%;

        padding-top:30px;
    }

    .header h1{

        font-size:30px;
    }

    .panel{

        padding:20px;
    }

    .button-row{

        flex-direction:column;
    }

    .download-item{

        align-items:flex-start;
    }

    .download-icon{

        width:42px;

        height:42px;

        min-width:42px;
    }

    .actions{

        flex-direction:column;
    }

    .edit-btn,
    .delete-btn{

        padding:8px 10px;
    }

    .list-header{

        align-items:flex-start;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            PRIME LEADER OFFICIAL
        </div>

        <h1>
            ADMIN <span>PANEL.</span>
        </h1>

        <p>
            Manage downloads from your Supabase database.
        </p>

        <button
            type="button"
            id="logoutBtn"
            class="logout-btn">

            LOGOUT

        </button>

    </header>


    <!-- ADD / EDIT -->

    <section class="panel">

        <div class="panel-title">

            <span id="formTitle">
                ADD
            </span>

            DOWNLOAD

        </div>


        <form id="downloadForm">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    DOWNLOAD NAME
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: InfernoX Emulator"
                    required>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    CATEGORY
                </label>

                <select
                    id="category"
                    required>

                    <option value="">
                        Select category
                    </option>

                    <option value="emulators">
                        Emulators
                    </option>

                    <option value="msi">
                        MSI
                    </option>

                    <option value="software">
                        Software
                    </option>

                    <option value="drivers">
                        Drivers
                    </option>

                    <option value="tools">
                        Tools
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    DESCRIPTION
                </label>

                <textarea
                    id="description"
                    placeholder="Write a short description..."
                    required></textarea>

            </div>


            <!-- URL -->

            <div class="form-group">

                <label>
                    DOWNLOAD URL
                </label>

                <input
                    type="url"
                    id="download_url"
                    placeholder="https://drive.google.com/..."
                    required>

            </div>


            <!-- BUTTONS -->

            <div class="button-row">

                <button
                    type="submit"
                    class="add-btn"
                    id="addBtn">

                    + ADD DOWNLOAD

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn">

                    CANCEL

                </button>

            </div>


            <div
                id="status"
                class="status">
            </div>


        </form>

    </section>


    <!-- CURRENT DOWNLOADS -->

    <section class="panel">

        <div class="list-header">

            <div class="panel-title">

                CURRENT
                <span>
                    DOWNLOADS
                </span>

            </div>


            <button
                type="button"
                class="refresh-btn"
                id="refreshBtn">

                ↻ REFRESH

            </button>

        </div>


        <div
            id="downloadList"
            class="download-list">

            <div class="empty">
                Loading downloads...
            </div>

        </div>

    </section>


    <!-- BACK -->

    <a
        href="downloads.html"
        class="back-btn">

        ← OPEN DOWNLOADS PAGE

    </a>


</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://qelvvvldriqtialnpelk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1-FLjKgb3U8xZyA_sWQ0Ow_LzNYl8ed";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const form =
    document.getElementById("downloadForm");

const formTitle =
    document.getElementById("formTitle");

const nameInput =
    document.getElementById("name");

const categoryInput =
    document.getElementById("category");

const descriptionInput =
    document.getElementById("description");

const urlInput =
    document.getElementById("download_url");

const statusBox =
    document.getElementById("status");

const addBtn =
    document.getElementById("addBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const downloadList =
    document.getElementById("downloadList");

const logoutBtn =
    document.getElementById("logoutBtn");


let editingId = null;


/* ==========================================
   AUTH CHECK
========================================== */

async function checkAuthentication(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if(error){

        console.error(
            "Auth Error:",
            error
        );

        window.location.replace(
            "login.html"
        );

        return false;
    }


    if(!data.session){

        window.location.replace(
            "login.html"
        );

        return false;
    }


    return true;
}


/* ==========================================
   STATUS
========================================== */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}


/* ==========================================
   CLEAR STATUS
========================================== */

function clearStatus(){

    statusBox.textContent =
        "";

    statusBox.className =
        "status";

}


/* ==========================================
   RESET FORM
========================================== */

function resetForm(){

    editingId =
        null;

    form.reset();

    formTitle.textContent =
        "ADD";

    addBtn.textContent =
        "+ ADD DOWNLOAD";

    cancelBtn.style.display =
        "none";

}


/* ==========================================
   ADD / UPDATE
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const authenticated =
            await checkAuthentication();


        if(!authenticated){
            return;
        }


        const name =
            nameInput.value.trim();

        const category =
            categoryInput.value;

        const description =
            descriptionInput.value.trim();

        const download_url =
            urlInput.value.trim();


        if(
            !name ||
            !category ||
            !description ||
            !download_url
        ){

            showStatus(
                "Please fill all fields.",
                "error"
            );

            return;
        }


        addBtn.disabled =
            true;


        addBtn.textContent =
            editingId
                ? "UPDATING..."
                : "ADDING...";


        try{


            /* ==========================
               UPDATE
            ========================== */

            if(editingId){

                const {
                    error
                } =
                await supabaseClient
                    .from("downloads")
                    .update({

                        name:name,

                        category:category,

                        description:description,

                        download_url:download_url

                    })
                    .eq(
                        "id",
                        editingId
                    );


                if(error){

                    throw error;

                }


                showStatus(
                    "Download updated successfully!",
                    "success"
                );


            }

            /* ==========================
               INSERT
            ========================== */

            else{

                const {
                    error
                } =
                await supabaseClient
                    .from("downloads")
                    .insert([{

                        name:name,

                        category:category,

                        description:description,

                        download_url:download_url

                    }]);


                if(error){

                    throw error;

                }


                showStatus(
                    "Download added successfully!",
                    "success"
                );

            }


            resetForm();


            await loadDownloads();


        }
        catch(error){

            console.error(
                "Database Error:",
                error
            );


            showStatus(
                "Failed: " +
                error.message,
                "error"
            );

        }
        finally{

            addBtn.disabled =
                false;


            if(!editingId){

                addBtn.textContent =
                    "+ ADD DOWNLOAD";

            }

        }

    }
);


/* ==========================================
   LOAD DOWNLOADS
========================================== */

async function loadDownloads(){

    downloadList.innerHTML = `
        <div class="empty">
            Loading downloads...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("downloads")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Load Error:",
            error
        );


        downloadList.innerHTML = `

            <div
                class="empty"
                style="color:#ff4444;">

                Failed to load downloads.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        downloadList.innerHTML = `

            <div class="empty">

                No downloads added yet.

            </div>

        `;

        return;
    }


    downloadList.innerHTML =
        "";


    data.forEach(
        function(download){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "download-item";


            const category =
                (
                    download.category ||
                    "download"
                ).toUpperCase();


            item.innerHTML = `

                <div class="download-icon">
                    ↓
                </div>


                <div class="download-info">

                    <div class="category">
                        ${escapeHTML(category)}
                    </div>


                    <h3>
                        ${escapeHTML(
                            download.name ||
                            "Untitled"
                        )}
                    </h3>


                    <small>
                        ${escapeHTML(
                            download.description ||
                            ""
                        )}
                    </small>

                </div>


                <div class="actions">

                    <button
                        class="edit-btn"
                        type="button">

                        EDIT

                    </button>


                    <button
                        class="delete-btn"
                        type="button">

                        DELETE

                    </button>

                </div>

            `;


            /* EDIT */

            item
                .querySelector(
                    ".edit-btn"
                )
                .addEventListener(
                    "click",
                    function(){

                        editDownload(
                            download
                        );

                    }
                );


            /* DELETE */

            item
                .querySelector(
                    ".delete-btn"
                )
                .addEventListener(
                    "click",
                    function(){

                        deleteDownload(
                            download.id
                        );

                    }
                );


            downloadList.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   EDIT
========================================== */

function editDownload(
    download
){

    editingId =
        download.id;


    nameInput.value =
        download.name || "";


    categoryInput.value =
        download.category || "";


    descriptionInput.value =
        download.description || "";


    urlInput.value =
        download.download_url || "";


    formTitle.textContent =
        "EDIT";


    addBtn.textContent =
        "✓ UPDATE DOWNLOAD";


    cancelBtn.style.display =
        "block";


    clearStatus();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==========================================
   CANCEL EDIT
========================================== */

cancelBtn.addEventListener(
    "click",
    function(){

        resetForm();

        clearStatus();

    }
);


/* ==========================================
   DELETE
========================================== */

async function deleteDownload(
    id
){

    const confirmed =
        confirm(
            "Are you sure you want to delete this download?"
        );


    if(!confirmed){
        return;
    }


    const authenticated =
        await checkAuthentication();


    if(!authenticated){
        return;
    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("downloads")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        showStatus(
            "Download deleted successfully!",
            "success"
        );


        await loadDownloads();

    }
    catch(error){

        console.error(
            "Delete Error:",
            error
        );


        showStatus(
            "Failed to delete: " +
            error.message,
            "error"
        );

    }

}


/* ==========================================
   REFRESH
========================================== */

refreshBtn.addEventListener(
    "click",
    async function(){

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "↻ LOADING...";


        await loadDownloads();


        refreshBtn.disabled =
            false;

        refreshBtn.textContent =
            "↻ REFRESH";

    }
);


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        const confirmed =
            confirm(
                "Logout from Admin Panel?"
            );


        if(!confirmed){
            return;
        }


        try{

            await supabaseClient
                .auth
                .signOut();

        }
        catch(error){

            console.error(
                "Logout Error:",
                error
            );

        }


        window.location.replace(
            "login.html"
        );

    }
);


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

async function startAdmin(){

    const authenticated =
        await checkAuthentication();


    if(!authenticated){
        return;
    }


    await loadDownloads();

}


/* START */

startAdmin();

</script>

</body>

</html>
