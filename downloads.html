<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Downloads | PRIME LEADER Official</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(230,0,0,.16),transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        rgba(255,255,255,.015) 1px,
        transparent 1px
    );
    background-size:100% 4px;
    opacity:.25;
}

/* HEADER */

.header{
    text-align:center;
    padding:55px 20px 35px;
}

.brand{
    display:inline-block;
    color:#ff2020;
    font-size:13px;
    font-weight:800;
    letter-spacing:4px;
    margin-bottom:15px;
}

.header h1{
    font-size:46px;
    letter-spacing:2px;
    line-height:1.1;
}

.header h1 span{
    color:#ff1e1e;
}

.header p{
    max-width:650px;
    margin:15px auto 0;
    color:#8e8e8e;
    line-height:1.6;
}

/* CONTAINER */

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
    padding-bottom:70px;
}

/* TABS */

.download-tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    padding:7px;
    margin:0 auto 35px;
    width:max-content;
    max-width:100%;
    background:#0b0b0b;
    border:1px solid #282828;
    border-radius:10px;
}

.download-tab{
    border:1px solid transparent;
    background:transparent;
    color:#888;
    padding:11px 19px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    font-weight:800;
    letter-spacing:.5px;
    transition:.25s;
}

.download-tab:hover{
    color:#fff;
}

.download-tab.active{
    background:#e60000;
    color:#fff;
    box-shadow:0 5px 20px rgba(230,0,0,.22);
}

/* CONTENT */

.download-tab-content{
    display:none;
}

.download-tab-content.active{
    display:block;
    animation:fadeIn .25s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* CARD */

.download-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:20px;
    padding:25px;
    margin-bottom:17px;
    background:linear-gradient(145deg,#121212,#0b0b0b);
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    transition:.25s;
}

.download-card:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:3px;
    background:#e60000;
    opacity:.5;
}

.download-card:hover{
    border-color:#e60000;
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.download-icon{
    width:62px;
    height:62px;
    min-width:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:#181818;
    border:1px solid #343434;
    color:#ff2020;
    font-size:20px;
    font-weight:900;
}

.download-info{
    flex:1;
}

.download-type{
    display:inline-block;
    color:#ff2929;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:5px;
}

.download-info h2{
    font-size:20px;
    margin-bottom:8px;
}

.download-info p{
    color:#8d8d8d;
    font-size:14px;
    line-height:1.5;
    margin-bottom:7px;
}

.download-info small{
    color:#555;
    font-size:11px;
}

/* SOURCE */

.source{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:5px 9px;
    border-radius:5px;
    background:#181818;
    border:1px solid #292929;
    color:#aaa;
    font-size:10px;
    font-weight:bold;
}

.source-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#e60000;
}

/* FEATURED */

.featured{
    border-color:#6d1616;
    box-shadow:0 0 30px rgba(230,0,0,.08);
}

.featured-badge{
    position:absolute;
    right:18px;
    top:15px;
    padding:5px 9px;
    border-radius:5px;
    background:#e60000;
    color:#fff;
    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
}

/* BUTTON */

.download-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:125px;
    padding:12px 20px;
    background:#e60000;
    color:#fff;
    text-decoration:none;
    border-radius:7px;
    font-size:12px;
    font-weight:900;
    letter-spacing:.4px;
    transition:.2s;
}

.download-btn:hover{
    background:#ff2929;
    box-shadow:0 7px 22px rgba(230,0,0,.28);
    transform:translateY(-2px);
}

/* EMPTY */

.empty-download{
    text-align:center;
    padding:65px 20px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:14px;
}

.empty-icon{
    font-size:38px;
    color:#e60000;
    margin-bottom:15px;
}

.empty-download h2{
    font-size:20px;
    margin-bottom:9px;
}

.empty-download p{
    color:#777;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.loading span{
    color:#e60000;
}

/* ERROR */

.error-box{
    text-align:center;
    padding:40px 20px;
    background:#120707;
    border:1px solid #4a1717;
    border-radius:14px;
    color:#ff5555;
}

/* BACK */

.back-btn{
    display:block;
    width:max-content;
    margin:35px auto 0;
    padding:11px 22px;
    border:1px solid #303030;
    border-radius:7px;
    color:#999;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
    transition:.2s;
}

.back-btn:hover{
    color:#fff;
    border-color:#e60000;
}

/* MOBILE */

@media(max-width:650px){

    .header{
        padding:40px 18px 28px;
    }

    .header h1{
        font-size:31px;
    }

    .header p{
        font-size:13px;
    }

    .download-tabs{
        width:100%;
    }

    .download-tab{
        flex:1;
        padding:10px 8px;
        font-size:10px;
    }

    .download-card{
        flex-direction:column;
        align-items:flex-start;
        padding:20px;
    }

    .download-icon{
        width:54px;
        height:54px;
        min-width:54px;
    }

    .download-info h2{
        font-size:18px;
    }

    .download-btn{
        width:100%;
        margin-top:5px;
    }

    .featured-badge{
        right:12px;
        top:12px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="brand">
        PRIME LEADER OFFICIAL
    </div>

    <h1>
        DOWNLOAD <span>TOOLS.</span>
    </h1>

    <p>
        Recommended emulators, MSI versions and official
        PRIME LEADER software.
    </p>

</header>


<main class="container">


    <!-- TABS -->

    <div class="download-tabs">

        <button
            class="download-tab active"
            onclick="showDownloadTab('emulators',this)">
            EMULATORS
        </button>

        <button
            class="download-tab"
            onclick="showDownloadTab('msi',this)">
            MSI
        </button>

        <button
            class="download-tab"
            onclick="showDownloadTab('software',this)">
            SOFTWARE
        </button>

        <button
            class="download-tab"
            onclick="showDownloadTab('drivers',this)">
            DRIVERS
        </button>

        <button
            class="download-tab"
            onclick="showDownloadTab('tools',this)">
            TOOLS
        </button>

    </div>


    <!-- EMULATORS -->

    <div
        id="emulators"
        class="download-tab-content active">

        <div class="loading">
            Loading <span>downloads...</span>
        </div>

    </div>


    <!-- MSI -->

    <div
        id="msi"
        class="download-tab-content">

        <div class="loading">
            Loading <span>downloads...</span>
        </div>

    </div>


    <!-- SOFTWARE -->

    <div
        id="software"
        class="download-tab-content">

        <div class="loading">
            Loading <span>downloads...</span>
        </div>

    </div>


    <!-- DRIVERS -->

    <div
        id="drivers"
        class="download-tab-content">

        <div class="loading">
            Loading <span>downloads...</span>
        </div>

    </div>


    <!-- TOOLS -->

    <div
        id="tools"
        class="download-tab-content">

        <div class="loading">
            Loading <span>downloads...</span>
        </div>

    </div>


    <a
        class="back-btn"
        href="index.html">
        ← BACK TO HOME
    </a>


</main>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://qelvvvldriqtialnpelk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1-FLjKgb3U8xZyA_sWQ0Ow_LzNYl8ed";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   TAB SYSTEM
========================================= */

function showDownloadTab(tabId, button){

    document
        .querySelectorAll('.download-tab-content')
        .forEach(function(content){

            content.classList.remove('active');

        });


    document
        .querySelectorAll('.download-tab')
        .forEach(function(tab){

            tab.classList.remove('active');

        });


    const section =
        document.getElementById(tabId);


    if(section){

        section.classList.add('active');

    }


    if(button){

        button.classList.add('active');

    }

}


/* =========================================
   ICON
========================================= */

function getCategoryIcon(category){

    switch(category){

        case "emulators":
            return "▣";

        case "msi":
            return "M";

        case "software":
            return "PL";

        case "drivers":
            return "⚙";

        case "tools":
            return "◈";

        default:
            return "↓";

    }

}


/* =========================================
   LOAD DOWNLOADS
========================================= */

async function loadDownloads(){

    const sections = {

        emulators:
            document.getElementById("emulators"),

        msi:
            document.getElementById("msi"),

        software:
            document.getElementById("software"),

        drivers:
            document.getElementById("drivers"),

        tools:
            document.getElementById("tools")

    };


    try{

        const { data, error } =
            await supabaseClient

                .from("downloads")

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            Object.values(sections)
                .forEach(function(section){

                    section.innerHTML = `
                        <div class="error-box">
                            Failed to load downloads.
                        </div>
                    `;

                });

            return;

        }


        console.log(
            "Downloads loaded:",
            data
        );


        /*
         * Remove loading messages
         */

        Object.values(sections)
            .forEach(function(section){

                section.innerHTML = "";

            });


        /*
         * No downloads
         */

        if(!data || data.length === 0){

            Object.values(sections)
                .forEach(function(section){

                    section.innerHTML = `
                        <div class="empty-download">

                            <div class="empty-icon">
                                ↓
                            </div>

                            <h2>
                                NO DOWNLOADS
                            </h2>

                            <p>
                                Downloads will be added soon.
                            </p>

                        </div>
                    `;

                });

            return;

        }


        /*
         * Prevent duplicate cards
         */

        const usedIds = new Set();


        data.forEach(function(download){

            /*
             * Skip duplicate database rows
             */

            const uniqueId =
                download.id ||
                download.download_url;


            if(usedIds.has(uniqueId)){

                return;

            }


            usedIds.add(uniqueId);


            /*
             * Category
             */

            const category =
                String(
                    download.category ||
                    "tools"
                )
                .trim()
                .toLowerCase();


            /*
             * Find category section
             */

            const section =
                sections[category];


            if(!section){

                console.warn(
                    "Unknown category:",
                    category,
                    download
                );

                return;

            }


            /*
             * Create card
             */

            const card =
                document.createElement("article");


            card.className =
                "download-card";


            /*
             * Featured support
             */

            if(download.featured){

                card.classList.add(
                    "featured"
                );

            }


            /*
             * Card content
             */

            card.innerHTML = `

                ${
                    download.featured
                    ? `
                        <div class="featured-badge">
                            FEATURED
                        </div>
                    `
                    : ""
                }


                <div class="download-icon">

                    ${getCategoryIcon(category)}

                </div>


                <div class="download-info">

                    <span class="download-type">

                        ${
                            category
                                .toUpperCase()
                        }

                    </span>


                    <h2>

                        ${
                            escapeHTML(
                                download.name ||
                                "DOWNLOAD"
                            )
                        }

                    </h2>


                    <p>

                        ${
                            escapeHTML(
                                download.description ||
                                ""
                            )
                        }

                    </p>


                    <small>

                        PRIME LEADER
                        • Official Download

                    </small>


                    <div class="source">

                        <span class="source-dot"></span>

                        Official Download

                    </div>

                </div>


                <a
                    class="download-btn"
                    href="${
                        escapeAttribute(
                            download.download_url ||
                            "#"
                        )
                    }"
                    target="_blank"
                    rel="noopener noreferrer">

                    DOWNLOAD ↗

                </a>

            `;


            section.appendChild(card);

        });


        /*
         * Empty categories
         */

        Object.entries(sections)
            .forEach(function([category,section]){

                if(section.children.length === 0){

                    section.innerHTML = `

                        <div class="empty-download">

                            <div class="empty-icon">

                                ◈

                            </div>

                            <h2>

                                ${
                                    category
                                        .toUpperCase()
                                }
                                COMING SOON

                            </h2>

                            <p>

                                More downloads will be
                                added here soon.

                            </p>

                        </div>

                    `;

                }

            });


    }
    catch(error){

        console.error(
            "Download loading error:",
            error
        );

    }

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadDownloads();

</script>


</body>
</html>
