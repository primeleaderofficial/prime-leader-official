<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | PRIME LEADER Official</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(230,0,0,.18),transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
    padding:50px 0 70px;
}

.header{
    text-align:center;
    margin-bottom:35px;
}

.brand{
    color:#ff2020;
    font-size:12px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:12px;
}

.header h1{
    font-size:40px;
}

.header h1 span{
    color:#ff2020;
}

.header p{
    color:#777;
    margin-top:10px;
    font-size:13px;
}

.panel{
    background:#0c0c0c;
    border:1px solid #292929;
    border-radius:14px;
    padding:28px;
    margin-bottom:25px;
}

.panel-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:22px;
}

.panel-title span{
    color:#ff2020;
}

/* LOGIN */

#loginPanel{
    max-width:500px;
    margin:0 auto 25px;
}

.login-note{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:13px 14px;
    background:#151515;
    border:1px solid #303030;
    border-radius:7px;
    color:#fff;
    outline:none;
    font-size:13px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#e60000;
}

.form-group select option{
    background:#111;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#e60000;
    color:#fff;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.main-btn:hover{
    background:#ff2929;
}

.main-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ADMIN */

#adminContent{
    display:none;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.logout-btn{
    padding:10px 15px;
    border:1px solid #451616;
    background:#180909;
    color:#ff4444;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.logout-btn:hover{
    background:#e60000;
    color:#fff;
}

.button-row{
    display:flex;
    gap:10px;
}

.add-btn{
    flex:1;
    padding:13px 18px;
    border:0;
    border-radius:7px;
    background:#e60000;
    color:#fff;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.add-btn:hover{
    background:#ff2929;
}

.add-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.cancel-btn,
.refresh-btn{
    padding:13px 18px;
    border-radius:7px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
}

.cancel-btn{
    display:none;
}

.cancel-btn:hover,
.refresh-btn:hover{
    color:#fff;
    border-color:#e60000;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:7px;
    display:none;
    font-size:12px;
}

.status.success{
    display:block;
    background:#09200f;
    border:1px solid #145c2c;
    color:#55e77b;
}

.status.error{
    display:block;
    background:#210909;
    border:1px solid #641717;
    color:#ff6666;
}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.list-header .panel-title{
    margin-bottom:0;
}

.download-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.download-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:17px;
    background:#121212;
    border:1px solid #292929;
    border-radius:10px;
}

.download-icon{
    width:48px;
    height:48px;
    min-width:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#181818;
    border:1px solid #333;
    border-radius:9px;
    color:#ff2020;
    font-weight:900;
    font-size:18px;
}

.download-info{
    flex:1;
    min-width:0;
}

.download-info h3{
    font-size:15px;
    margin-bottom:5px;
}

.download-info small{
    display:block;
    color:#666;
    font-size:10px;
    line-height:1.5;
}

.category{
    color:#ff2929;
    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:5px;
}

.actions{
    display:flex;
    gap:7px;
}

.edit-btn,
.delete-btn{
    padding:9px 12px;
    border-radius:6px;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.edit-btn{
    border:1px solid #303030;
    background:#181818;
    color:#aaa;
}

.delete-btn{
    border:1px solid #451616;
    background:#180909;
    color:#ff4444;
}

.edit-btn:hover{
    color:#fff;
    border-color:#e60000;
}

.delete-btn:hover{
    background:#e60000;
    color:#fff;
}

.empty{
    text-align:center;
    padding:35px 20px;
    border:1px dashed #292929;
    border-radius:10px;
    color:#666;
    font-size:12px;
}

.back-btn{
    display:block;
    width:max-content;
    margin:25px auto 0;
    padding:10px 20px;
    border:1px solid #303030;
    border-radius:7px;
    color:#888;
    text-decoration:none;
    font-size:11px;
    font-weight:bold;
}

.back-btn:hover{
    color:#fff;
    border-color:#e60000;
}

@media(max-width:650px){

    .container{
        width:94%;
        padding-top:30px;
    }

    .header h1{
        font-size:30px;
    }

    .panel{
        padding:20px;
    }

    .topbar{
        align-items:flex-start;
    }

    .button-row{
        flex-direction:column;
    }

    .download-item{
        align-items:flex-start;
    }

    .actions{
        flex-direction:column;
    }

    .edit-btn,
    .delete-btn{
        padding:8px 10px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <div class="brand">PRIME LEADER OFFICIAL</div>

    <h1>
        ADMIN <span>PANEL.</span>
    </h1>

    <p>
        Secure download management system.
    </p>
</header>


<!-- LOGIN -->

<section class="panel" id="loginPanel">

    <div class="panel-title">
        ADMIN <span>LOGIN</span>
    </div>

    <div class="login-note">
        Login with your authorized PRIME LEADER admin email and password.
    </div>

    <form id="loginForm">

        <div class="form-group">

            <label>EMAIL</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Admin email"
                required>

        </div>

        <div class="form-group">

            <label>PASSWORD</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>

        </div>

        <button
            type="submit"
            class="main-btn"
            id="loginBtn">

            LOGIN TO ADMIN

        </button>

        <div
            id="loginStatus"
            class="status">
        </div>

    </form>

</section>


<!-- ADMIN CONTENT -->

<div id="adminContent">

    <div class="topbar">

        <div>
            <div class="brand">
                ADMINISTRATOR
            </div>
        </div>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn">

            LOGOUT

        </button>

    </div>


    <!-- ADD / EDIT -->

    <section class="panel">

        <div class="panel-title">
            <span id="formTitle">ADD</span> DOWNLOAD
        </div>

        <form id="downloadForm">

            <div class="form-group">

                <label>DOWNLOAD NAME</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: InfernoX Emulator"
                    required>

            </div>


            <div class="form-group">

                <label>CATEGORY</label>

                <select id="category" required>

                    <option value="">
                        Select category
                    </option>

                    <option value="emulators">
                        Emulators
                    </option>

                    <option value="msi">
                        MSI
                    </option>

                    <option value="software">
                        Software
                    </option>

                    <option value="drivers">
                        Drivers
                    </option>

                    <option value="tools">
                        Tools
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>DESCRIPTION</label>

                <textarea
                    id="description"
                    placeholder="Write a short description..."
                    required></textarea>

            </div>


            <div class="form-group">

                <label>DOWNLOAD URL</label>

                <input
                    type="url"
                    id="download_url"
                    placeholder="https://drive.google.com/..."
                    required>

            </div>


            <div class="button-row">

                <button
                    type="submit"
                    class="add-btn"
                    id="addBtn">

                    + ADD DOWNLOAD

                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn">

                    CANCEL

                </button>

            </div>


            <div
                id="status"
                class="status">
            </div>

        </form>

    </section>


    <!-- DOWNLOADS -->

    <section class="panel">

        <div class="list-header">

            <div class="panel-title">
                CURRENT <span>DOWNLOADS</span>
            </div>

            <button
                type="button"
                class="refresh-btn"
                id="refreshBtn">

                ↻ REFRESH

            </button>

        </div>

        <br>

        <div
            id="downloadList"
            class="download-list">

            <div class="empty">
                Loading downloads...
            </div>

        </div>

    </section>


    <a
        href="../downloads.html"
        class="back-btn">

        ← OPEN DOWNLOADS PAGE

    </a>

</div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://qelvvvldriqtialnpelk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1-FLjKgb3U8xZyA_sWQ0Ow_LzNYl8ed";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const loginPanel =
    document.getElementById("loginPanel");

const adminContent =
    document.getElementById("adminContent");

const loginForm =
    document.getElementById("loginForm");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginBtn =
    document.getElementById("loginBtn");

const loginStatus =
    document.getElementById("loginStatus");

const logoutBtn =
    document.getElementById("logoutBtn");

const form =
    document.getElementById("downloadForm");

const formTitle =
    document.getElementById("formTitle");

const nameInput =
    document.getElementById("name");

const categoryInput =
    document.getElementById("category");

const descriptionInput =
    document.getElementById("description");

const urlInput =
    document.getElementById("download_url");

const statusBox =
    document.getElementById("status");

const addBtn =
    document.getElementById("addBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const downloadList =
    document.getElementById("downloadList");


let editingId = null;


/* ==========================================
   STATUS
========================================== */

function showStatus(message,type){

    statusBox.textContent = message;

    statusBox.className =
        "status " + type;

}

function showLoginStatus(message,type){

    loginStatus.textContent = message;

    loginStatus.className =
        "status " + type;

}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginBtn.disabled = true;

        loginBtn.textContent =
            "LOGGING IN...";

        loginStatus.className =
            "status";

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });


        if(error){

            console.error(error);

            showLoginStatus(
                "Login failed: " + error.message,
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "LOGIN TO ADMIN";

            return;
        }


        console.log(
            "Logged in:",
            data.user
        );


        showAdmin();

        await loadDownloads();


        loginBtn.disabled = false;

        loginBtn.textContent =
            "LOGIN TO ADMIN";

    }
);


/* ==========================================
   CHECK SESSION
========================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(data.session){

        showAdmin();

        await loadDownloads();

    }else{

        showLogin();

    }

}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin(){

    loginPanel.style.display =
        "block";

    adminContent.style.display =
        "none";

}


/* ==========================================
   SHOW ADMIN
========================================== */

function showAdmin(){

    loginPanel.style.display =
        "none";

    adminContent.style.display =
        "block";

}


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        const confirmed =
            confirm(
                "Logout from Admin Panel?"
            );

        if(!confirmed){
            return;
        }

        await supabaseClient
            .auth
            .signOut();

        showLogin();

        showLoginStatus(
            "You have been logged out.",
            "success"
        );

    }
);


/* ==========================================
   RESET FORM
========================================== */

function resetForm(){

    editingId = null;

    form.reset();

    formTitle.textContent =
        "ADD";

    addBtn.textContent =
        "+ ADD DOWNLOAD";

    cancelBtn.style.display =
        "none";

    statusBox.className =
        "status";

    statusBox.textContent =
        "";

}


/* ==========================================
   ADD / UPDATE
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const name =
            nameInput.value.trim();

        const category =
            categoryInput.value;

        const description =
            descriptionInput.value.trim();

        const download_url =
            urlInput.value.trim();


        addBtn.disabled = true;

        addBtn.textContent =
            editingId
                ? "UPDATING..."
                : "ADDING...";


        try{

            if(editingId){

                const {
                    error
                } =
                await supabaseClient
                    .from("downloads")
                    .update({
                        name:name,
                        category:category,
                        description:description,
                        download_url:download_url
                    })
                    .eq("id",editingId);


                if(error){

                    showStatus(
                        "Failed to update: " +
                        error.message,
                        "error"
                    );

                    return;
                }


                resetForm();

                showStatus(
                    "Download updated successfully!",
                    "success"
                );

            }else{

                const {
                    error
                } =
                await supabaseClient
                    .from("downloads")
                    .insert([
                        {
                            name:name,
                            category:category,
                            description:description,
                            download_url:download_url
                        }
                    ]);


                if(error){

                    showStatus(
                        "Failed to add: " +
                        error.message,
                        "error"
                    );

                    return;
                }


                resetForm();

                showStatus(
                    "Download added successfully!",
                    "success"
                );

            }


            await loadDownloads();

        }
        catch(error){

            console.error(error);

            showStatus(
                "Something went wrong.",
                "error"
            );

        }
        finally{

            addBtn.disabled = false;

            if(editingId === null){

                addBtn.textContent =
                    "+ ADD DOWNLOAD";

            }

        }

    }
);


/* ==========================================
   LOAD DOWNLOADS
========================================== */

async function loadDownloads(){

    downloadList.innerHTML = `
        <div class="empty">
            Loading downloads...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("downloads")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        downloadList.innerHTML = `
            <div class="empty" style="color:#ff4444;">
                Failed to load downloads.<br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        downloadList.innerHTML = `
            <div class="empty">
                No downloads added yet.
            </div>
        `;

        return;
    }


    downloadList.innerHTML = "";


    data.forEach(
        function(download){

            const item =
                document.createElement("div");

            item.className =
                "download-item";


            item.innerHTML = `

                <div class="download-icon">
                    ↓
                </div>

                <div class="download-info">

                    <div class="category">
                        ${escapeHTML(
                            (download.category || "DOWNLOAD")
                            .toUpperCase()
                        )}
                    </div>

                    <h3>
                        ${escapeHTML(
                            download.name || "Untitled"
                        )}
                    </h3>

                    <small>
                        ${escapeHTML(
                            download.description || ""
                        )}
                    </small>

                </div>

                <div class="actions">

                    <button
                        type="button"
                        class="edit-btn">

                        EDIT

                    </button>

                    <button
                        type="button"
                        class="delete-btn">

                        DELETE

                    </button>

                </div>

            `;


            item
                .querySelector(".edit-btn")
                .addEventListener(
                    "click",
                    function(){

                        editDownload(download);

                    }
                );


            item
                .querySelector(".delete-btn")
                .addEventListener(
                    "click",
                    function(){

                        deleteDownload(
                            download.id
                        );

                    }
                );


            downloadList.appendChild(item);

        }
    );

}


/* ==========================================
   EDIT
========================================== */

function editDownload(download){

    editingId =
        download.id;

    nameInput.value =
        download.name || "";

    categoryInput.value =
        download.category || "";

    descriptionInput.value =
        download.description || "";

    urlInput.value =
        download.download_url || "";

    formTitle.textContent =
        "EDIT";

    addBtn.textContent =
        "✓ UPDATE DOWNLOAD";

    cancelBtn.style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================
   CANCEL
========================================== */

cancelBtn.addEventListener(
    "click",
    function(){

        resetForm();

    }
);


/* ==========================================
   DELETE
========================================== */

async function deleteDownload(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this download?"
        );

    if(!confirmed){
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("downloads")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        showStatus(
            "Failed to delete: " +
            error.message,
            "error"
        );

        return;
    }


    showStatus(
        "Download deleted successfully!",
        "success"
    );

    await loadDownloads();

}


/* ==========================================
   REFRESH
========================================== */

refreshBtn.addEventListener(
    "click",
    async function(){

        refreshBtn.disabled = true;

        refreshBtn.textContent =
            "↻ LOADING...";

        await loadDownloads();

        refreshBtn.disabled = false;

        refreshBtn.textContent =
            "↻ REFRESH";

    }
);


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   START
========================================== */

checkSession();

</script>

</body>
</html>
